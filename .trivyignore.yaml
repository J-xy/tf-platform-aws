# Suppressions are decisions, not silencing. Each entry says what was weighed
# and why the rule does not fit this context. Anything without a defensible
# reason gets fixed instead of listed here.

misconfigurations:
  - id: AVD-AWS-0132
    paths:
      - "bootstrap/main.tf"
    statement: >-
      "S3 encryption should use Customer Managed Keys". Deliberate: this is the
      bootstrap state bucket, and SSE-KMS would create two problems the rule
      cannot see. Every principal running a plan would need kms:Decrypt on the
      key, and the key itself becomes a dependency that must exist before any
      state does - a second bootstrap problem inside the first. SSE-S3 gives
      encryption at rest with no key policy to manage. Revisit if this bucket
      ever holds state for accounts that need separate key custody or an audit
      trail of decrypt calls.

  - id: AVD-AWS-0178
    paths:
      - "modules/baseline-vpc/main.tf"
      # Same file reached through a git source (envs/*), which Trivy reports
      # under the remote path: git::https:/github.com/.../baseline-vpc?ref=vX/...
      - "**/modules/baseline-vpc/main.tf"
    statement: >-
      "VPC Flow Logs should be enabled". A real gap, deferred rather than
      dismissed. Flow logs need a CloudWatch log group or S3 destination and
      bill on ingested volume, and this lab is deliberately at zero hourly
      cost. The expiry below forces this back onto the list rather than
      letting it rot as a permanent exception.
    expiredAt: 2027-03-01

  - id: AVD-AWS-0095
    paths:
      - "org/budgets.tf"
    statement: >-
      "Topic does not have encryption enabled". This topic carries only AWS
      Budgets alerts: a budget name and dollar figures, nothing secret. The
      no-cost fix breaks the control: the AWS-managed alias/aws/sns key has a
      fixed key policy that cannot grant budgets.amazonaws.com, so Budgets
      fails to publish and alerts drop silently. The real fix is a
      customer-managed key whose policy grants Budgets kms:GenerateDataKey*
      and kms:Decrypt, at about $1/month plus a key policy to maintain, for no
      confidentiality gain on this payload. Revisit if this topic ever carries
      anything beyond budget alerts.
